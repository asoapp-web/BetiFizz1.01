workflows:
  betifizz-workflow:
    name: BetiFizz
    max_build_duration: 120
    instance_type: mac_mini_m1
    integrations:
      app_store_connect: BetiFizz API
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.beti.fizz
      vars:
        BUNDLE_ID: "com.beti.fizz"
        XCODE_SCHEME: "BetiFizz"
        APP_STORE_APPLE_ID: 6761179199
      xcode: latest
    scripts:
      - name: Set up provisioning profiles settings on Xcode project
        script: xcode-project use-profiles
      
      - name: Clean build folder
        script: |
          xcodebuild clean -project "BetiFizz.xcodeproj" -scheme "$XCODE_SCHEME"
          rm -rf ~/Library/Developer/Xcode/DerivedData/BetiFizz-*
      
      - name: Fix missing CFBundleIconName in project.pbxproj
        script: |
          # Добавляем CFBundleIconName через настройки проекта, а не Info.plist
          cd "$CM_BUILD_DIR"
          
          # Проверяем и добавляем настройку в проект
          if ! grep -q "ASSETCATALOG_COMPILER_APPICON_NAME" "BetiFizz.xcodeproj/project.pbxproj"; then
            echo "Adding ASSETCATALOG_COMPILER_APPICON_NAME to project"
            sed -i '' 's/INFOPLIST_FILE = BetiFizz\/Info.plist;/INFOPLIST_FILE = BetiFizz\/Info.plist; ASSETCATALOG_COMPILER_APPICON_NAME = AppIcon;/g' BetiFizz.xcodeproj/project.pbxproj
          fi
      
      - name: Increment build number
        script: |
          cd "$CM_BUILD_DIR"
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo "0")
          NEW_BUILD_NUMBER=$((LATEST_BUILD_NUMBER + 1))
          agvtool new-version -all $NEW_BUILD_NUMBER
      
      - name: Build ipa for distribution
        script: |
          xcode-project build-ipa \
            --project "BetiFizz.xcodeproj" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
