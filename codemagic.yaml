workflows:
  betifizz-workflow:
    name: BetiFizz
    max_build_duration: 120
    instance_type: mac_mini_m1
    integrations:
      app_store_connect: BetiFizz API
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.beti.fizz
      vars:
        BUNDLE_ID: "com.beti.fizz"
        XCODE_SCHEME: "BetiFizz"
        APP_STORE_APPLE_ID: 6761179199
      xcode: latest
    scripts:
      - name: Set up provisioning profiles settings on Xcode project
        script: xcode-project use-profiles
      
      - name: Fix Info.plist - add CFBundleIconName
        script: |
          # Путь к Info.plist (обычно в Runner или основном проекте)
          INFO_PLIST="BetiFizz/Info.plist"
          
          # Если не найден, ищем в стандартных местах
          if [ ! -f "$INFO_PLIST" ]; then
            INFO_PLIST="ios/Runner/Info.plist"
          fi
          if [ ! -f "$INFO_PLIST" ]; then
            INFO_PLIST="$CM_BUILD_DIR/BetiFizz/Info.plist"
          fi
          
          # Добавляем CFBundleIconName если отсутствует
          if ! /usr/libexec/PlistBuddy -c "Print :CFBundleIconName" "$INFO_PLIST" 2>/dev/null; then
            echo "Adding CFBundleIconName to Info.plist"
            /usr/libexec/PlistBuddy -c "Add :CFBundleIconName string AppIcon" "$INFO_PLIST"
          else
            echo "CFBundleIconName already exists"
          fi
          
          # Проверяем, что добавилось
          /usr/libexec/PlistBuddy -c "Print :CFBundleIconName" "$INFO_PLIST"
      
      - name: Increment build number
        script: |
          cd "$CM_BUILD_DIR"
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID")
          agvtool new-version -all $(($LATEST_BUILD_NUMBER + 1))
      
      - name: Build ipa for distribution
        script: |
          xcode-project build-ipa \
            --project "BetiFizz.xcodeproj" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
